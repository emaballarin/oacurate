name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v6
              with:
                  python-version: "3.14"
            - run: uv sync --locked
            - run: uv run ruff format --check
            - run: uv run ruff check
            - run: uv run pytest
            - run: uv run python -O -m pytest
