[project]
name = "oacurate"
version = "0.2.0"
description = "Curate your own OpenAlex author profile through the official curation API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emanuele Ballarin", email = "emanuele@ballarin.cc" }]
# simple-parsing 0.1.9 imports dataclasses._MISSING_TYPE, which Python 3.15 removed (MISSING is now
# a sentinel); lift the cap once a simple-parsing release supports 3.15.
requires-python = ">=3.14,<3.15"
dependencies = [
    "bibtexparser>=2.1,<3",
    "httpx>=0.28,<1",
    "simple-parsing>=0.1.9",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/emaballarin/oacurate"

[project.scripts]
oacurate = "oacurate.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.0"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["simple_parsing.subparsers", "simple_parsing.field"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: smoke tests against free OpenAlex single lookups (network)"]
filterwarnings = [
    # simple-parsing 0.1.9 passes argparse's deprecated prefix_chars on Python 3.14
    "ignore:The use of the undocumented 'prefix_chars' parameter:DeprecationWarning",
]
